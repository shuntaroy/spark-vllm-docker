# Recipe: Qwen3.6-35B-A3B (BF16, full precision)
# MoE 35B total / 3B active (qwen3_5_moe), served unquantised on a single DGX Spark.
#
# KaLC recipe, derived from upstream recipes/qwen3.6-35b-a3b-fp8.yaml:
# - BF16 checkpoint (71.9 GB) instead of the official FP8 (37.5 GB): full
#   precision is the reason to run it on the Spark rather than a Mac.
# - solo (-tp 1, no ray); no VLLM_MARLIN_USE_ATOMIC_ADD (that is for FP8 kernels).
# - keeps upstream's fixed chat template mod, flashinfer attention, fp8 KV,
#   qwen3_xml tool parser, qwen3 reasoning parser.
# - fastsafetensors loader: matches the vllm-node image we run.
# UNVERIFIED: MTP is not enabled (upstream recipe does not use it either).

recipe_version: "1"
name: Qwen3.6-35B-A3B-BF16
description: vLLM serving Qwen/Qwen3.6-35B-A3B in BF16 on a single DGX Spark

model: Qwen/Qwen3.6-35B-A3B

container: vllm-node

mods:
  - mods/fix-qwen3.6-chat-template

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 16384

env: {}

command: |
  vllm serve Qwen/Qwen3.6-35B-A3B \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --chat-template fixed_chat_template.jinja \
    -tp {tensor_parallel}
