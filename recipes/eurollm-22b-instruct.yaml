# Recipe: utter-project/EuroLLM-22B-Instruct-2512
# EuroLLM 22B Instruct (LlamaForCausalLM, dense, BF16, 42.2 GiB, 32k ctx), served
# on a single DGX Spark next to Olmo-3.1-32B-Instruct.
#
# Why the -2512 checkpoint: it is the released successor to the -Preview upload
# and the newest non-preview 22B the project ships. EuroLLM is not on OpenRouter,
# and its class-A open training data (Japanese included) is the reason to hold a
# native-precision copy locally.
#
# Choices:
# - plain LlamaForCausalLM with a ChatML-style chat template in
#   tokenizer_config.json; no trust-remote-code, no parser mods needed.
# - ON-DEMAND ONLY. This was meant to share pouse with Olmo-3.1-32B-Instruct, but
#   the two do not co-fit at BF16: 42.2 + 60.1 GiB of weights against ~118 GiB
#   usable leaves nothing for two engines' overhead plus two KV caches. Verified
#   2026-08-24 — the attempt thrashed the node into unresponsiveness rather than
#   failing cleanly. Stop Olmo before starting this. See
#   docs/multi-model-serving.md in the dgx-setup repo.
# - memory is an absolute budget in GiB via mods/gpu-mem-util-gb, not a fraction.
#   Sized for a node to itself: 60 GiB against 42.2 GiB of weights plus ~6 GiB of
#   CUDA graph, activation and non-torch overhead leaves ~12 GiB of KV, ~230k
#   tokens at fp8 (54 KiB/token: 8 KV heads, head_dim 128, 54 layers), so the
#   model's full native 32k window has concurrency behind it.
# - --kv-cache-dtype fp8 and --load-format fastsafetensors: same as the sibling
#   recipes on this image.

recipe_version: "1"
name: EuroLLM-22B-Instruct
description: vLLM serving utter-project/EuroLLM-22B-Instruct-2512 (dense 22B, BF16, single node)

model: utter-project/EuroLLM-22B-Instruct-2512

container: vllm-node

# Own container: mutually exclusive with vllm_olmo31_32b (see above).
container_name: vllm_eurollm_22b

mods:
  - mods/gpu-mem-util-gb

# NOTE: gpu_memory_utilization is GiB here, not a fraction (see mods above).
defaults:
  port: 8004
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 60
  max_model_len: 32768
  max_num_batched_tokens: 8192

env: {}

command: |
  vllm serve utter-project/EuroLLM-22B-Instruct-2512 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization-gb {gpu_memory_utilization} \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    -tp {tensor_parallel}
